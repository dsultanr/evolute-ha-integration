# Evolute - карточка со схемой автомобиля
#
# Замените CAR_ID_HERE на ID вашего автомобиля везде в этом файле.
# Его можно узнать из entity_id любого сенсора Evolute,
# например sensor.evolute_CAR_ID_HERE_battery_percentage
#
# SVG-файлы и карточка кнопки копируются интеграцией в /config/www/evolute/
# автоматически, сторонние HACS-карточки (card-mod / button-card) не нужны.
# Кнопки используют собственную карточку custom:evolute-hold-button с удержанием.

type: vertical-stack
cards:
  # Ряд 1: температура и общий статус
  - type: horizontal-stack
    cards:
      - type: tile
        entity: sensor.evolute_CAR_ID_HERE_outside_temp
        name: На улице
        icon: mdi:thermometer
      - type: tile
        entity: sensor.evolute_CAR_ID_HERE_battery_percentage
        name: Заряд
        icon: mdi:battery
      - type: tile
        entity: binary_sensor.evolute_CAR_ID_HERE_online
        name: Связь
        icon: mdi:car-connected
        tap_action:
          action: call-service
          service: homeassistant.update_entity
          service_data:
            entity_id: sensor.evolute_CAR_ID_HERE_battery_percentage
          confirmation:
            text: "Обновить данные с сервера сейчас?"

  # Ряд 2: левая колонка, схема автомобиля, правая колонка
  - type: horizontal-stack
    cards:
      # Левая колонка
      - type: vertical-stack
        cards:
          - type: tile
            entity: sensor.evolute_CAR_ID_HERE_battery_voltage
            name: 12В АКБ
            icon: mdi:car-battery
            vertical: false
          - type: tile
            entity: sensor.evolute_CAR_ID_HERE_remains_mileage
            name: Запас хода
            icon: mdi:map-marker-distance
            vertical: false
          - type: tile
            entity: sensor.evolute_CAR_ID_HERE_satellites
            name: GPS
            icon: mdi:satellite-variant
            vertical: false

      # Центр: схема автомобиля сверху
      - type: picture-elements
        image: /local/evolute/car-full.svg
        elements:
          # Синий контур = центральный замок закрыт (машина "заперта")
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_central_lock
                state: "off"
            elements:
              - type: image
                image: /local/evolute/car-perimeter.svg
                style:
                  top: 50%
                  left: 50%
                  width: 100%
                  height: 100%
                  transform: translate(-50%, -50%)
                  pointer-events: none

          # Багажник открыт
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_trunk
                state: "on"
            elements:
              - type: image
                image: /local/evolute/door-trunk-open.svg
                style:
                  top: 0
                  left: 0
                  width: 100%
                  height: 100%
                  pointer-events: none

          # Водительская дверь открыта
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_door_fl
                state: "on"
            elements:
              - type: image
                image: /local/evolute/door-fl-open.svg
                style:
                  top: 0
                  left: 0
                  width: 100%
                  height: 100%
                  pointer-events: none

          # Передняя пассажирская дверь открыта
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_door_fr
                state: "on"
            elements:
              - type: image
                image: /local/evolute/door-fr-open.svg
                style:
                  top: 0
                  left: 0
                  width: 100%
                  height: 100%
                  pointer-events: none

          # Задняя левая дверь открыта
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_door_rl
                state: "on"
            elements:
              - type: image
                image: /local/evolute/door-rl-open.svg
                style:
                  top: 0
                  left: 0
                  width: 100%
                  height: 100%
                  pointer-events: none

          # Задняя правая дверь открыта
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_door_rr
                state: "on"
            elements:
              - type: image
                image: /local/evolute/door-rr-open.svg
                style:
                  top: 0
                  left: 0
                  width: 100%
                  height: 100%
                  pointer-events: none

          # Иконка замка (видна, когда закрыт)
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_central_lock
                state: "off"
            elements:
              - type: icon
                icon: mdi:lock-outline
                style:
                  top: 8%
                  left: 30%
                  color: "#00c0fc"
                  --mdc-icon-size: 26px
                  opacity: 0.9

          # Иконка зажигания
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_ignition
                state: "on"
            elements:
              - type: icon
                icon: mdi:engine
                style:
                  top: 8%
                  left: 70%
                  color: var(--state-binary_sensor-running-on-color, var(--state-binary_sensor-on-color, var(--state-active-color)))
                  --mdc-icon-size: 26px
                  opacity: 1

          # Иконка климата (виден, когда включён)
          - type: conditional
            conditions:
              - entity: binary_sensor.evolute_CAR_ID_HERE_climate
                state: "on"
            elements:
              - type: icon
                icon: mdi:air-conditioner
                style:
                  top: 90%
                  left: 50%
                  color: "#00c0fc"
                  --mdc-icon-size: 24px
                  opacity: 0.9

          # Температура снаружи по центру машины
          - type: state-label
            entity: sensor.evolute_CAR_ID_HERE_outside_temp
            suffix: "°C"
            style:
              top: 45%
              left: 50%
              color: var(--primary-text-color)
              font-size: 12px
              font-weight: bold
              text-shadow: 2px 2px 4px rgba(0,0,0,0.8)

      # Правая колонка
      - type: vertical-stack
        cards:
          - type: tile
            entity: sensor.evolute_CAR_ID_HERE_odometer
            name: Пробег
            icon: mdi:counter
            vertical: false
          - type: tile
            entity: sensor.evolute_CAR_ID_HERE_speed
            name: Скорость
            icon: mdi:speedometer
            vertical: false
          - type: tile
            entity: binary_sensor.evolute_CAR_ID_HERE_ignition
            name: Зажигание
            icon: mdi:key
            vertical: false

  # Ряд 3: кнопки управления с удержанием
  #
  # custom:evolute-hold-button входит в состав интеграции — файл копируется в
  # /config/www/evolute/ и регистрируется как ресурс Lovelace автоматически.
  # Если дашборд в YAML-режиме, добавьте ресурс вручную:
  #   resources:
  #     - url: /local/evolute/evolute-hold-button.js
  #       type: module
  #
  # Короткое касание команду НЕ отправляет: кольцо вокруг иконки заполняется, пока
  # держите, и только после этого уходит команда. Пока машина не подтвердила её
  # телеметрией, кнопка показывает песочные часы и «отправлено…».
  - type: horizontal-stack
    cards:
      - type: custom:evolute-hold-button
        name: Замок
        icon: mdi:lock-outline
        entity: button.evolute_CAR_ID_HERE_central_lock_toggle
        state_entity: binary_sensor.evolute_CAR_ID_HERE_central_lock
        state_labels:
          "on": Открыт
          "off": Закрыт
        hold_time: 800
      - type: custom:evolute-hold-button
        name: Прогрев
        icon: mdi:radiator
        entity: button.evolute_CAR_ID_HERE_heating_toggle
        state_entity: binary_sensor.evolute_CAR_ID_HERE_heating
        state_labels:
          "on": Включён
          "off": Отключён
      - type: custom:evolute-hold-button
        name: Охлаждение
        icon: mdi:snowflake
        entity: button.evolute_CAR_ID_HERE_cooling_toggle
        state_entity: binary_sensor.evolute_CAR_ID_HERE_cooling
        state_labels:
          "on": Включено
          "off": Отключено
      - type: custom:evolute-hold-button
        name: Сигнал
        icon: mdi:bullhorn
        entity: button.evolute_CAR_ID_HERE_blink
        # Сигнал безобиден — отправляем обычным касанием.
        require_hold: false

  # Ряд 4: багажник и подготовка к поездке — только длинным нажатием
  - type: horizontal-stack
    cards:
      - type: custom:evolute-hold-button
        name: Багажник
        icon: mdi:car-back
        entity: button.evolute_CAR_ID_HERE_trunk_toggle
        state_entity: binary_sensor.evolute_CAR_ID_HERE_trunk
        state_labels:
          "on": Открыт
          "off": Закрыт
        hold_time: 1000
      - type: custom:evolute-hold-button
        name: Подготовить
        icon: mdi:car-clock
        entity: button.evolute_CAR_ID_HERE_prepare_start
        state_entity: binary_sensor.evolute_CAR_ID_HERE_preparing
        state_labels:
          "on": Идёт
          "off": Не запущена
        hold_time: 1000
      - type: custom:evolute-hold-button
        name: Отменить
        icon: mdi:car-off
        entity: button.evolute_CAR_ID_HERE_prepare_cancel
        hold_time: 1000

  # Дополнительно: подробные списки сенсоров
  - type: entities
    title: Двери и багажник
    entities:
      - entity: binary_sensor.evolute_CAR_ID_HERE_door_fl
      - entity: binary_sensor.evolute_CAR_ID_HERE_door_fr
      - entity: binary_sensor.evolute_CAR_ID_HERE_door_rl
      - entity: binary_sensor.evolute_CAR_ID_HERE_door_rr
      - entity: binary_sensor.evolute_CAR_ID_HERE_trunk
      - entity: binary_sensor.evolute_CAR_ID_HERE_headlights

  - type: entities
    title: Климат
    entities:
      - entity: binary_sensor.evolute_CAR_ID_HERE_climate
      - entity: binary_sensor.evolute_CAR_ID_HERE_climate_front_defrost
      - entity: sensor.evolute_CAR_ID_HERE_climate_target_temp
      - entity: sensor.evolute_CAR_ID_HERE_climate_current_temp
      - entity: sensor.evolute_CAR_ID_HERE_inboard_temp

  - type: entities
    title: Батарея и температуры
    entities:
      - entity: sensor.evolute_CAR_ID_HERE_battery_temp
      - entity: sensor.evolute_CAR_ID_HERE_coolant_temp
      - entity: sensor.evolute_CAR_ID_HERE_fuel_percentage
      - entity: sensor.evolute_CAR_ID_HERE_remains_mileage_fuel

  - type: entities
    title: Обслуживание
    entities:
      - entity: sensor.evolute_CAR_ID_HERE_maintenance_days_left
        name: ТО через (дней)
      - entity: sensor.evolute_CAR_ID_HERE_maintenance_km_left
        name: ТО через (км)
      - entity: sensor.evolute_CAR_ID_HERE_maintenance_date
        name: Дата ТО
      - entity: sensor.evolute_CAR_ID_HERE_maintenance_mileage
        name: Пробег к ТО
      - entity: binary_sensor.evolute_CAR_ID_HERE_update_available
        name: Доступно обновление
      - entity: binary_sensor.evolute_CAR_ID_HERE_warnings
        name: Предупреждения

  - type: entities
    title: Подготовка к поездке и связь
    entities:
      - entity: binary_sensor.evolute_CAR_ID_HERE_preparing
      - entity: sensor.evolute_CAR_ID_HERE_prep_end_time
        name: Осталось
      - entity: sensor.evolute_CAR_ID_HERE_prep_script_time
        name: Длительность
      - entity: binary_sensor.evolute_CAR_ID_HERE_prep_available
      - entity: binary_sensor.evolute_CAR_ID_HERE_prep_error
      - entity: sensor.evolute_CAR_ID_HERE_status_text
        name: Статус
      - entity: sensor.evolute_CAR_ID_HERE_telemetry_time
        name: Телеметрия от
      - entity: binary_sensor.evolute_CAR_ID_HERE_location_enabled

  - type: map
    entities:
      - entity: device_tracker.evolute_CAR_ID_HERE
    hours_to_show: 24
    aspect_ratio: "16:9"
